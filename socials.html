<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Socials – FinaFeels</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Fina's Social World</h1>
    <p>Connect with Fina and explore her latest collaborations.</p>
  </header>

  <main>
    <!-- Latest Collaboration Card -->
    <section class="collab-preview-card">
      <h2>Latest Collaboration</h2>
      <img src="placeholder.jpg" alt="Latest Collaboration" style="max-width:100%; border-radius:10px;" />
    </section>

    <!-- Other content (unchanged) -->
    <section>
      <h2>Connect with Fina</h2>
      <ul>
        <li><a href="#">Instagram</a></li>
        <li><a href="#">TikTok</a></li>
        <li><a href="#">Twitter</a></li>
        <li><a href="#">LinkedIn</a></li>
      </ul>
    </section>
  </main>

  <!-- Firebase script to auto-update latest collaboration -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, query, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getStorage, ref, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBNAiBbjBl7SpqwL0NiJmx3BVuRrd1FVBA",
      authDomain: "finafeels-39852.firebaseapp.com",
      projectId: "finafeels-39852",
      storageBucket: "finafeels-39852.firebasestorage.app",
      messagingSenderId: "962083690885",
      appId: "1:962083690885:web:115469c62f982fa24fccec",
      measurementId: "G-C60L4MRLYR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    async function updateLatestCollab() {
      const collabRef = collection(db, 'FinaFeels_Collaboration_Feature');
      const q = query(collabRef, orderBy('Date', 'desc'), limit(1));

      const snapshot = await getDocs(q);
      if (!snapshot.empty) {
        const latestData = snapshot.docs[0].data();
        if (latestData.Images && latestData.Images.length > 0) {
          const imageURL = await getDownloadURL(ref(storage, latestData.Images[0]));
          const latestImage = document.querySelector('.collab-preview-card img');
          if (latestImage) {
            latestImage.src = imageURL;
            latestImage.alt = latestData.Title || "Latest Collaboration";
          }
        }
      }
    }

    updateLatestCollab();
  </script>

  <script src="script.js"></script>
</body>
</html>
