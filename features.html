<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Featured Collaborations – FinaFeels</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #FAFAFA;
      color: #2C2C2C;
    }

    header {
      padding: 3rem 1rem 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
    }

    /* Magazine-style layout */
    .collab-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 1rem;
      border-bottom: 1px solid #E0E0E0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .collab-media img {
      width: auto;
      max-width: 100%;
      max-height: 80vh; /* prevents overly tall images */
      margin-bottom: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .collab-media video {
      width: 100%;
      max-width: 600px;
      margin-bottom: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .collab-title {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .collab-desc {
      font-size: 1rem;
      color: #555;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .no-print {
      display: block;
    }

    @media print {
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Featured Collaborations</h1>
    <p style="color:#666; max-width: 720px; margin: 0 auto;">
      Scroll through our most recent collabs. Each one is a fully immersive,
      flexible storytelling block powered by Firebase.
    </p>
  </header>

  <main id="collab-feed"></main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getStorage, ref, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBNAiBbjBl7SpqwL0NiJmx3BVuRrd1FVBA",
      authDomain: "finafeels-39852.firebaseapp.com",
      projectId: "finafeels-39852",
      storageBucket: "finafeels-39852.firebasestorage.app",
      messagingSenderId: "962083690885",
      appId: "1:962083690885:web:115469c62f982fa24fccec",
      measurementId: "G-C60L4MRLYR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const feed = document.getElementById('collab-feed');
    const collabRef = collection(db, 'FinaFeels_Collaboration_Feature');

    const renderCollab = async (data) => {
      const section = document.createElement('section');
      section.className = 'collab-section';

      section.innerHTML = `
        <h2 class="collab-title">${data.Title}</h2>
        <p class="collab-desc">${data.Description}</p>
        <div class="collab-media"></div>
      `;

      const mediaContainer = section.querySelector('.collab-media');

      for (const path of data.Images || []) {
        const url = await getDownloadURL(ref(storage, path));
        const img = document.createElement('img');
        img.src = url;
        mediaContainer.appendChild(img);
      }

      if (data.Video) {
        const videoURL = await getDownloadURL(ref(storage, data.Video));
        const video = document.createElement('video');
        video.controls = true;
        video.className = 'no-print';
        video.src = videoURL;
        mediaContainer.appendChild(video);
      }

      feed.appendChild(section);
    };

    const loadCollabs = async () => {
      const snapshot = await getDocs(collabRef);
      console.log("Docs found:", snapshot.size);
      snapshot.forEach(doc => {
        console.log("Doc data:", doc.data());
        renderCollab(doc.data());
      });
    };

    loadCollabs();
  </script>
</body>
</html>
