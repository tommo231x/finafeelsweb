<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Firestore Collections Debug</title>
</head>
<body>
  <h1>Listing All Firestore Collections</h1>
  <ul id="collection-list"></ul>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, listCollections } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBNAiBbjBl7SpqwL0NiJmx3BVuRrd1FVBA",
      authDomain: "finafeels-39852.firebaseapp.com",
      projectId: "finafeels-39852",
      storageBucket: "finafeels-39852.firebasestorage.app",
      messagingSenderId: "962083690885",
      appId: "1:962083690885:web:115469c62f982fa24fccec",
      measurementId: "G-C60L4MRLYR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function listAllCollections() {
      const collections = await listCollections(db);
      const listEl = document.getElementById('collection-list');
      collections.forEach(col => {
        const li = document.createElement('li');
        li.textContent = col.id;
        console.log("Collection found:", col.id);
        listEl.appendChild(li);
      });
    }

    listAllCollections();
  </script>
</body>
</html>
