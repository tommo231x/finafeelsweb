<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Featured Collaborations – FinaFeels</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      /* Gradient background */
      background: linear-gradient(135deg, #f8cdda 0%, #1d2b64 100%);
      color: #2C2C2C;
    }

    header {
      padding: 3rem 1rem 2rem;
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 2.5rem;
      color: #ffffff;
    }

    header p {
      color: #f5f5f5;
    }

    /* Back button styling */
    .back-button {
      position: absolute;
      left: 20px;
      top: 20px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 10px 18px;
      border-radius: 25px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: translateX(-2px);
    }

    .collab-section {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
      backdrop-filter: blur(6px);
    }

    .collab-media img {
      width: auto;
      max-width: 100%;
      max-height: 80vh;
      margin-bottom: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .collab-media video {
      width: 100%;
      max-width: 600px;
      margin-bottom: 1rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .collab-title {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #ffffff;
      text-align: center;
    }

    .collab-desc {
      font-size: 1rem;
      color: #f1f1f1;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .no-print {
      display: block;
    }

    @media print {
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <!-- Back Button -->
    <a href="socials.html" class="back-button">← Back to Socials</a>
    <h1>Featured Collaborations</h1>
    <p>Scroll through our most recent collabs. Each one is a fully immersive, flexible storytelling block powered by Firebase.</p>
  </header>

  <main id="collab-feed"></main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { getStorage, ref, getDownloadURL } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

    const firebaseConfig = {
      apiKey: "AIzaSyBNAiBbjBl7SpqwL0NiJmx3BVuRrd1FVBA",
      authDomain: "finafeels-39852.firebaseapp.com",
      projectId: "finafeels-39852",
      storageBucket: "finafeels-39852.firebasestorage.app",
      messagingSenderId: "962083690885",
      appId: "1:962083690885:web:115469c62f982fa24fccec",
      measurementId: "G-C60L4MRLYR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const feed = document.getElementById('collab-feed');
    const collabRef = collection(db, 'FinaFeels_Collaboration_Feature');

    const renderCollab = async (data) => {
      const section = document.createElement('section');
      section.className = 'collab-section';

      section.innerHTML = `
        <h2 class="collab-title">${data.Title}</h2>
        <p class="collab-desc">${data.Description}</p>
        <div class="collab-media"></div>
      `;

      const mediaContainer = section.querySelector('.collab-media');

      for (const path of data.Images || []) {
        const url = await getDownloadURL(ref(storage, path));
        const img = document.createElement('img');
        img.src = url;
        mediaContainer.appendChild(img);
      }

      if (data.Video) {
        const videoURL = await getDownloadURL(ref(storage, data.Video));
        const video = document.createElement('video');
        video.controls = true;
        video.className = 'no-print';
        video.src = videoURL;
        mediaContainer.appendChild(video);
      }

      feed.appendChild(section);
    };

    const loadCollabs = async () => {
      const snapshot = await getDocs(collabRef);
      console.log("Docs found:", snapshot.size);
      snapshot.forEach(doc => {
        console.log("Doc data:", doc.data());
        renderCollab(doc.data());
      });
    };

    loadCollabs();
  </script>
</body>
</html>
